name: Rebuild offline presentation

on:
  push:
    branches: [main]
    paths:
      - 'dist/app.js'
      - 'dist/style.css'
      - 'dist/index.html'
      - 'dist/assets/**'
      - 'dist/font-*.ttf'
      - 'dist/three.module.js'
      - 'build-single.py'
      - '.github/workflows/rebuild-offline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the presentation
        uses: actions/checkout@v4
      - name: Build self-contained HTML
        run: python3 build-single.py
      - name: Commit generated HTML if it changed
        run: |
          if ! git diff --quiet -- dist/presentation.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/presentation.html
            git commit -m "Rebuild standalone HTML presentation"
            git push
          else
            echo "Standalone HTML is already up-to-date."
          fi
