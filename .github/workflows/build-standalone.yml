name: Build offline presentation

on:
  push:
    branches: [main]
    paths:
      - 'dist/app.js'
      - 'dist/wardley-scene.js'
      - 'dist/dithering.js'
      - 'dist/style.css'
      - 'dist/index.html'
      - 'dist/assets/**'
      - 'dist/font-*.ttf'
      - 'dist/three.module.js'
      - 'build-single.py'
      - '.github/workflows/build-standalone.yml'
  workflow_dispatch:

# Serialize rebuilds while multiple slide edits land on main.
concurrency:
  group: standalone-presentation-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest presentation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate presentation JavaScript
        run: |
          node --input-type=module --check < dist/app.js
          node --input-type=module --check < dist/dithering.js

      - name: Rebuild standalone offline HTML
        run: |
          git pull --ff-only origin main
          python3 build-single.py

      - name: Commit updated HTML
        run: |
          if ! git diff --quiet -- dist/presentation.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/presentation.html
            git commit -m "Build standalone HTML after scene changes [skip ci]"
            git push origin HEAD:main
          else
            echo "Standalone HTML is already up to date."
          fi
